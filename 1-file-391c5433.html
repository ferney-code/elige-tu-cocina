background:radial-gradient(circle at 92% 84%,#ffffff70 0 .07em,#fff0 .16em),radial-gradient(130% 120% at 18% 12%,#ffffff55,#ffffff14 40%,#ffffff08 68%,#ffffff22),hsl(calc(var(--h) + 20) 70% 24%/.42);

box-shadow:inset 0 0 .2em #ffffffa6,inset .08em .06em .16em hsl(calc(var(--h) + 300) 100% 90%/.7),inset -.08em -.06em .2em hsl(calc(var(--h) + 120) 100% 80%/.6),0 .05em 0 hsl(var(--h) 80% 25%/.35)}

}
/* Índice de letras: zona táctil a la derecha + burbuja de cristal traslúcida */
#z{position:fixed;z-index:20;top:0;bottom:0;right:0;width:max(46px,min(12vw,84px));display:flex;align-items:center;justify-content:center;padding-right:env(safe-area-inset-right,0px);touch-action:none;-webkit-user-select:none;user-select:none}
#ix{--iw:clamp(34px,5.2vmin,56px);position:relative;height:min(90dvh,calc(100dvh - 24px));width:var(--iw);margin-right:clamp(6px,1.2vmin,14px);padding:10px 0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;border-radius:20px;
border:1.5px solid #ffffffb3;
background:radial-gradient(120% 60% at 20% 4%,#ffffff66,#ffffff14 45%,#ffffff08 70%,#ffffff26),linear-gradient(160deg,#ffffff2e,#ffffff0f 50%,#ffffff1f);
-webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7);
box-shadow:inset 0 0 14px #ffffff66,inset 4px 3px 9px #ffd6ff66,inset -4px -3px 10px #b8f4ff66,0 6px 22px #00000040;
opacity:0;transform:translateX(70%) scale(.8);pointer-events:none;transition:opacity .28s,transform .35s cubic-bezier(.3,1.5,.5,1)}
#ix.v{opacity:1;transform:none;pointer-events:auto}
#ix::before{content:"";position:absolute;top:6px;left:5px;width:11px;height:34%;border-radius:50%;background:linear-gradient(180deg,#fffffff0,#fff0);pointer-events:none}
#ix::after{content:"";position:absolute;bottom:10px;right:5px;width:7px;height:7px;border-radius:50%;background:#ffffffb3;pointer-events:none}

</style></head><body>
<div id="s"></div>
<div id="z"><div id="ix"></div></div>
<script>
const L="ABCDEFGHIJKLMNÑOPQRSTUVWXYZ",
D="🐝Abeja,🐳Ballena,🚗Carro,🐬Delfín,🐘Elefante,🍓Fresa,🐱Gato,🍦Helado,🏝️Isla,🦒Jirafa,🐨Koala,🦁León,🦋Mariposa,☁️Nube,🍝Ñoquis,🐻Oso,🐠Pez,🧀Queso,🐸Rana,☀️Sol,🐢Tortuga,🍇Uvas,🐮Vaca,🧇Waffle,🎵Xilófono,🪀Yoyó,🦊Zorro".split(","),
S=Math.sin,P=Math.PI,R=()=>Math.random()*100|0;
/* Una transición distinta por letra: q va de -1 (sale arriba) a 1 (entra desde abajo) */
const F=[
/*A*/(q,t)=>[`perspective(700px) rotateX(${-q*100}deg) scale(${1-t*.4})`,1-t],
/*B burbuja*/(q,t)=>[`translateY(${-q*30}vh) scale(${(1-t)*(1+.25*S(t*22))})`,1-t*.6],
/*C*/(q,t)=>[`rotate(${q*540}deg) scale(${1-t*.7})`,1-t],
/*D dominó*/(q,t)=>[`translate(${q*55}vw,${t*25}vh) rotate(${q*75}deg)`,1-t*.6],
/*E*/(q,t)=>[`skewX(${q*70}deg) scale(${1+t},${1-t*.6})`,1-t],
/*F*/(q,t)=>[`translateY(${q*40}vh) scale(${1+t})`,1-t,`blur(${t*18}px)`],
/*G*/(q,t)=>[`scale(${1+t*8})`,Math.max(0,1-t*1.6)],
/*H*/(q,t)=>[`perspective(700px) rotateY(${q*180}deg)`,1-t*.9],
/*I*/(q,t)=>[`translate(${q*40}vw,${q*60}vh) scale(${1-t})`,1],
/*J columpio*/(q,t)=>[`translateY(${-t*60}vh) rotate(${S(q*14)*25}deg)`,1-t*.5],
/*K*/(q,t)=>[`translateX(${q*110}vw) rotate(${q*40}deg)`,1],
/*L*/(q,t)=>[`scale(${1+t*2.5},${1-t*.9})`,1-t],
/*M ola*/(q,t)=>[`translate(${S(q*9)*30}vw,${q*35}vh) rotate(${S(q*9)*30}deg)`,1-t*.5],
/*N arcoíris*/(q,t)=>[`scale(${1-t*.5})`,1-t*.5,`hue-rotate(${q*360}deg) saturate(2)`],
/*Ñ*/(q,t)=>[`perspective(700px) rotateX(${q*360}deg)`,1-t*.8],
/*O ventana redonda*/(q,t)=>["",1,"",t<.02?"none":`circle(${(1-t)*75}% at 50% 50%)`],
/*P*/(q,t)=>[`scale(${1+S(t*P)*.7-t}) translateY(${q*15}vh)`,1-t*.5],
/*Q*/(q,t)=>[`perspective(700px) rotate3d(1,1,0,${q*270}deg)`,1-t*.7],
/*R rueda*/(q,t)=>[`translateX(${q*100}vw) rotate(${q*720}deg)`,1],
/*S serpiente*/(q,t)=>[`translateX(${S(q*12)*40}vw) scaleY(${1+t}) skewY(${q*40}deg)`,1-t*.6],
/*T torre*/(q,t)=>[`translateY(30vh) rotate(${q*95}deg) translateY(-30vh)`,1-t*.5],
/*U*/(q,t)=>[`translate(${q*70}vw,${q*q*45}vh) rotate(${q*120}deg)`,1],
/*V*/(q,t)=>[`translate(${q*60}vw,${-t*40}vh) rotate(${-q*30}deg)`,1],
/*W tembleque*/(q,t)=>[`rotate(${S(q*30)*35}deg) scale(${1-t*.6})`,1-t],
/*X espejo*/(q,t)=>[`scale(${Math.cos(q*P)},${1-t*.3})`,1-t*.7],
/*Y*/(q,t)=>[`perspective(700px) rotateY(${q*720}deg) scale(${1-t*.5})`,1-t*.8],
/*Z zigzag*/(q,t)=>[`translate(${Math.sign(q)*(1-Math.abs((t*4)%2-1))*50}vw,${q*70}vh)`,1]
];
const s=document.getElementById("s");
s.innerHTML=[...L].map((c,i)=>{
const m=D[i].match(/^(\P{L}+)(.+)$/u),h=Math.round(i*360/27);
const sp=Array.from({length:10},()=>`<u style="left:${R()}%;top:${R()}%;--z:${8+R()*.2}px;--d:${(R()/30).toFixed(1)}s"></u>`).join("");
return `<section class="l k${i%4}" style="--h:${h}"><div class="ray"></div><div class="halo"></div>${sp}${i?"":'<div class="hint">Desliza hacia arriba</div>'}<div class="ch"><span class="g">${c}</span><div class="e"><i><b></b></i><i><b></b></i></div></div><div class="w"><span>${m[1]}</span> <b class="wd">${m[2]}</b><i class="sh"></i></div></section>`}).join("");
const els=[...s.children],hint=s.querySelector(".hint");
let H=s.clientHeight,tk=0,ly=0,act=els[0],rt,cur=0,rz=0;
/* Bloquear zoom por gestos (Safari iOS) y doble toque */
["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["+","-","=","0"].includes(e.key))e.preventDefault()});
const io=new IntersectionObserver(es=>es.forEach(x=>{x.target.classList.toggle("on",x.isIntersecting);if(x.isIntersecting){act=x.target;document.documentElement.style.background=document.body.style.background="hsl("+(+x.target.style.getPropertyValue("--h")+40)+" 85% 36%)"}}),{root:s,threshold:.5});
els.forEach(e=>{e.c=e.querySelector(".ch");e.w=e.querySelector(".w");io.observe(e)});
function up(){tk=0;if(rz)return;const y=s.scrollTop;cur=Math.max(0,Math.min(els.length-1,Math.round(y/H)));
els.forEach((e,i)=>{const q=(i*H-y)/H;
if(Math.abs(q)>1.05){if(!e.h){e.h=1;e.c.style.opacity=0;e.c.style.transform="none";e.c.style.filter="none";e.c.style.clipPath="none"}return}
e.h=0;
const t=Math.min(1,Math.abs(q)),r=F[i](q,t),st=e.c.style;
st.transform=r[0]||"none";st.opacity=r[1];st.filter=r[2]||"none";st.clipPath=r[3]||"none";
e.w.style.opacity=Math.max(0,1-t*1.5)});
if(hint)hint.style.opacity=y>30?0:1;
act.style.setProperty("--py",Math.max(-1,Math.min(1,(y-ly)/10)).toFixed(2));ly=y;
clearTimeout(rt);rt=setTimeout(()=>act.style.setProperty("--py",0),500)}
s.addEventListener("scroll",()=>{if(!tk)tk=requestAnimationFrame(up)},{passive:true});
/* Al girar la pantalla o cambiar el tamaño: quedarse en la misma letra */
function rs(){rz=0;const nh=s.clientHeight;if(!nh)return;
s.style.scrollSnapType="none";H=nh;s.scrollTop=cur*nh;ly=s.scrollTop;
requestAnimationFrame(()=>{s.style.scrollSnapType="";up()})}
function qr(){if(s.clientHeight===H&&!rz)return;rz=1;cancelAnimationFrame(qr.t);qr.t=requestAnimationFrame(()=>setTimeout(rs,120))}
addEventListener("resize",qr);addEventListener("orientationchange",qr);
if(window.visualViewport)visualViewport.addEventListener("resize",qr);
["touchstart","touchmove"].forEach(n=>s.addEventListener(n,e=>act.style.setProperty("--px",((e.touches[0].clientX/innerWidth-.5)*2).toFixed(2)),{passive:true}));
s.addEventListener("click",e=>{const l=e.target.closest(".ch")&&e.target.closest(".l");if(!l)return;
const i=els.indexOf(l);l.classList.add("pop");setTimeout(()=>l.classList.remove("pop"),520);
try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(L[i]+", "+D[i].replace(/^\P{L}+/u,""));u.lang="es-CO";u.rate=.8;u.pitch=1.3;speechSynthesis.speak(u)}catch(_){}});
/* Índice de letras: tocar la zona derecha lo muestra/oculta; tocar o arrastrar sobre las letras salta a ellas */
const z=document.getElementById("z"),ix=document.getElementById("ix");
ix.innerHTML=[...L].map(c=>`<b>${c}</b>`).join("");
const bs=[...ix.children];let ht,pd=0,ai=-1;
function mark(){if(cur===ai)return;if(bs[ai])bs[ai].classList.remove("a");ai=cur;bs[ai].classList.add("a")}
let lu=0;
function show(){lu=Date.now();ix.classList.add("v");clearTimeout(ht);ht=setTimeout(hide,4000)}
function hide(){ix.classList.remove("v");pd=0}
function go(y){const r=ix.getBoundingClientRect(),i=Math.max(0,Math.min(L.length-1,Math.floor((y-r.top-10)/((r.height-20)/L.length))));
if(i===cur)return;cur=i;s.style.scrollSnapType="none";s.scrollTop=i*H;requestAnimationFrame(()=>{s.style.scrollSnapType="";up()});mark();
try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}}
z.addEventListener("pointerdown",e=>{e.preventDefault();
if(!ix.classList.contains("v")){show();return}
if(e.target.closest("#ix")){pd=1;try{z.setPointerCapture(e.pointerId)}catch(_){}go(e.clientY);show()}else hide()});
z.addEventListener("pointermove",e=>{if(pd){go(e.clientY);show()}});
["pointerup","pointercancel"].forEach(n=>z.addEventListener(n,()=>{pd=0;if(ix.classList.contains("v"))show()}));
/* Cualquier otra acción (tocar fuera, deslizar, rueda, teclas) la oculta de inmediato */
const out=()=>{if(ix.classList.contains("v")&&!pd)hide()};
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#z"))out()},true);
document.addEventListener("touchmove",e=>{if(!e.target.closest("#z"))out()},{passive:true,capture:true});
addEventListener("wheel",out,{passive:true});addEventListener("keydown",out);
s.addEventListener("scroll",()=>{if(!pd){mark();if(Date.now()-lu>500)out()}},{passive:true});
/* iPad: trackpad/ratón (al acercarse al borde derecho aparece) y teclado externo (flechas, Re Pág/Av Pág, Inicio/Fin) */
z.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")show()});
function jump(i){i=Math.max(0,Math.min(L.length-1,i));if(i===cur)return;cur=i;s.scrollTo({top:i*H,behavior:"smooth"});mark()}
addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;
const k=e.key,n={ArrowDown:1,ArrowRight:1,PageDown:1," ":1,ArrowUp:-1,ArrowLeft:-1,PageUp:-1}[k];
if(n){e.preventDefault();jump(cur+(k===" "&&e.shiftKey?-1:n))}
else if(k==="Home"){e.preventDefault();jump(0)}else if(k==="End"){e.preventDefault();jump(L.length-1)}});
mark();
up();
</script></body></html>
