name: Apply kitchen build
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f 1-app.js || exit 0
          mv -f 1-app.js app.js
          mv -f 2-app.css app.css
          git config user.name 'bot'
          git config user.email 'bot@users.noreply.github.com'
          git rm -f .github/workflows/.github/workflows/fix.yml
          git add app.js app.css 1-app.js 2-app.css
          git commit -m 'Apply round 3 build'
          git push
