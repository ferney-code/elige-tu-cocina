name: fix
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs: {fix: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {run: "for f in $(ls | grep -E '^[0-9]+-'); do git mv \"$f\" \"${f#*-}\"; done; git config user.name bot; git config user.email bot@users.noreply.github.com; git commit -m rename && git push"}]}}
