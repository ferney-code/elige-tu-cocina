name: Fix uploaded names r9
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mv -f 1-app.js app.js
          mv -f 2-index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html 1-app.js 2-index.html
          git commit -m "Fix uploaded names r9"
          git push
