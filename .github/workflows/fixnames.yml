name: fix-names
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in [0-9]-*; do [ -f "$f" ] && mv -f "$f" "${f#*-}"; done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Fix uploaded names r7" && git push)
