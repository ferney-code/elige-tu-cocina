name: Apply round 3b
on:
  push:
    paths:
      - '.github/workflows/round3b.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mv -f 1-app.js app.js
          mv -f 2-app.css app.css
          mv -f 3-index.html index.html
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "Apply round 3b build"
          git push
