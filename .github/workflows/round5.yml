name: Apply round 5
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply uploaded build
        run: |
          test -f 1-app.js || exit 0
          mv -f 1-app.js app.js
          mv -f 2-app.css app.css
          mv -f 3-index.html index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Apply round 5 stone countertops build'
          git push
